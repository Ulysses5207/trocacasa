<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrocaCasa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f5f9}
header{background:#0f172a;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;font-size:22px}.logo span{color:#22c55e}
.hero{background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;padding:50px 20px;text-align:center}
.btn{background:#22c55e;color:#fff;padding:14px 28px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
.container{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:20px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card img{width:100%;height:180px;object-fit:cover}
.card-info{padding:14px}
.tag{background:#dcfce7;color:#166534;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<header><div class="logo">🏠 Troca<span>Casa</span></div><div>100 pts</div></header>
<div class="hero"><h1>Troque sua casa e ganhe pontos</h1><p>Quanto mais participa, mais destaque</p><button class="btn" style="margin-top:20px">+ Anunciar Minha Casa</button></div>
<div class="container"><h2>🏡 Casas para Troca - Indaial</h2>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=600"><div class="card-info"><span class="tag">350 pts - Ouro</span><h3>Casa Centro - Indaial</h3><p>120m² - 3 quartos</p></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600"><div class="card-info"><span class="tag">210 pts - Prata</span><h3>Casa com Piscina - Blumenau</h3><p>150m²</p></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=600"><div class="card-info"><span class="tag">120 pts - Bronze</span><h3>Casa Timbó</h3><p>90m²</p></div></div>
</div></div></body></html>
