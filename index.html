<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrocaCasa - Troque sua casa com pontos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#f1f5f9}
header{background:#0f172a;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:bold;font-size:22px}.logo span{color:#22c55e}
.pontos{background:#1e293b;border:1px solid #22c55e;padding:6px 12px;border-radius:20px;font-size:14px}
.hero{background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;padding:50px 20px;text-align:center}
.btn{background:#22c55e;color:#fff;padding:14px 28px;border-radius:10px;border:none;font-weight:bold;font-size:17px;cursor:pointer}
.container{max-width:1100px;margin:auto;padding:25px 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:20px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card img{width:100%;height:180px;object-fit:cover}
.card-info{padding:14px}
.tag{background:#dcfce7;color:#166534;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold}
.regras{background:#fff;border-radius:15px;padding:22px;margin-top:35px}
.regras li{list-style:none;padding:10px 0;border-bottom:1px solid #eee}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:100;padding:15px}
.box{background:#fff;padding:22px;border-radius:15px;width:100%;max-width:400px}
.box input{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px}
